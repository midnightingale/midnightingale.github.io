<!DOCTYPE html>
<html lang="en" class="page-transition-entering">
<head>
  <meta charset="UTF-8">
  <meta name="viewport">
  <meta name="theme-color" content="#000000">
  <style>html { background: #000; }</style>
  <title>sophie dot gallery</title>
  <link rel="icon" type="image/x-icon" href="https://ik.imagekit.io/gale/love-letter.ico?updatedAt=1727232078691">
  <link rel="stylesheet" href="../../global/style.css">
  <link rel="stylesheet" href="../styles/gallery.css?v=32">
  <link rel="stylesheet" href="../styles/main-hall.css?v=49">
  <script defer src="../../global/transitions.js"></script>
</head>
<body>
  <div class="page-transition-overlay" aria-hidden="true"></div>
  <div id="gallery" class="gallery-hall viewport-height" data-lighting="dark" data-frames="none" style="--wall-color: #17253f; --floor-tint-base: #4f4945; --wall-text-color: #d8dce5; --enter-text-color: #413b38; --museum-label-bg: #c9c5bd;">
    <div class="wall">
      <a class="exit-sign" href="../index.html#strangers" aria-label="Exit to the main hall">
        <span class="exit-sign-hanger" aria-hidden="true"></span>
        <span class="exit-sign-back">
          <span class="exit-sign-front">
            <span class="exit-sign-image">
              <img src="../assets/exit-man.svg" alt="">
            </span>
          </span>
        </span>
      </a>
      <div class="gallery-entry wall-text-spotlight">
        <div class="wall-text">
          <h1>strangers</h1>
          <p>in this older collection, I wanted to explore what it means to know someone, or how it feels not to. I fancied myself a surrealist at the time. most of these images sprung into my mind fully formed.</p>
        </div>
        <a class="enter-text" href="#first-artwork">enter →</a>
      </div>
      <figure class="exhibit">
        <img id="first-artwork" class="artwork framed less-tall" src="https://ik.imagekit.io/gale/gallery-strangers/mourning-dove" alt="Mourning Dove">
        <button class="museum-label" type="button"><h2>mourning dove<span class="museum-year">(2019)</span></h2><p class="museum-metadata">oil on panel</p><p>
          something something they paved paradise and put in a parking lot, on not knowing what you have until it's gone
        </p></button>
      </figure>

      <figure class="exhibit">
        <img class="artwork framed tall" src="https://ik.imagekit.io/gale/gallery-strangers/strange-land" alt="Strange Land">
        <button class="museum-label" type="button"><h2>stranger in a strange land<span class="museum-year">(2019)</span></h2><p class="museum-metadata">acrylic on panel</p>
        <p>
          this piece is referenced from photos I took when I traveled to the town where my mother grew up. I found it largely abandoned, still without electricity and crumbling. now and then I would come across some elderly holdouts, watering their tomato plants in plastic tubs.
          <br><br>
          this piece is also inspired by the work of Scott Listfield.
        </p></button>
      </figure>

      <figure class="exhibit">
        <img class="artwork framed tall" src="https://ik.imagekit.io/gale/gallery-strangers/moondance" alt="Moondance">
        <button class="museum-label" type="button"><h2>moondance<span class="museum-year">(2019)</span></h2><p class="museum-metadata">acrylic on panel</p><p>
          this was a construction site that I'd pass on my way home from school. I imagined seeing a stranger performing there to no one, only for the love of it... years later, the construction finished, and I lived in this building for a while.
        </p></button>
      </figure>

      <figure class="exhibit">
        <img class="artwork framed less-tall" src="https://ik.imagekit.io/gale/gallery-strangers/flame" alt="Flame">
        <button class="museum-label" type="button"><h2>old flame<span class="museum-year">(2018)</span></h2><p class="museum-metadata">watercolour on paper</p><p>
          on when he became a stranger, and the moment she decides to leave
        </p></button>
      </figure>

      <figure class="exhibit">
        <img class="artwork framed tall" src="https://ik.imagekit.io/gale/gallery-strangers/surface-tension" alt="Surface Tension">
        <button class="museum-label" type="button"><h2>surface tension<span class="museum-year">(2020)</span></h2><p class="museum-metadata">oil on canvas</p><p>
          on impostor syndrome and suffocation, trying to stay where you can't be known
        </p></button>
      </figure>

      <figure class="exhibit">
        <img class="artwork framed tall" src="https://ik.imagekit.io/gale/gallery-strangers/still-here" alt="Still Here">
        <button class="museum-label" type="button"><h2>still here<span class="museum-year">(2018)</span></h2><p class="museum-metadata">acrylic on panel</p><p>
          an arrangement of detritus, from the life of a stranger struggling to stick around
        </p></button>
      </figure>

      <figure class="exhibit">
        <img class="artwork framed taller" src="https://ik.imagekit.io/gale/gallery-strangers/mirror" alt="Mirror">
        <button class="museum-label" type="button"><h2>mirror<span class="museum-year">(2020)</span></h2><p class="museum-metadata">acrylic on panel</p><p>
          i don't remember why I wanted to create this image, but I do remember painting this in a delirium at 2am, not understanding that water dilutes the binders in acrylic paint, smearing it directly on with my bare hands trying to get it to stick
        </p></button>
      </figure>

      <figure class="exhibit">
        <img class="artwork framed taller" src="https://ik.imagekit.io/gale/gallery-strangers/indigo-silence" alt="Indigo Silence">
        <button class="museum-label" type="button"><h2>indigo silence<span class="museum-year">(2018)</span></h2><p class="museum-metadata">acrylic on panel</p><p>
          on childhood and letting go
        </p></button>
      </figure>

      <figure class="exhibit">
        <img class="artwork framed taller" src="https://ik.imagekit.io/gale/gallery-strangers/homogenization" alt="Homogenization">
        <button class="museum-label" type="button"><h2>homogenization<span class="museum-year">(2018)</span></h2><p class="museum-metadata">pencil crayon on paper</p><p>
          a meditation on milk, rebirth, flavour perhaps
        </p></button>
      </figure>
      <a class="gallery-door gallery-return-door" href="../index.html#strangers" style="--door-wall-color: #edebeb;" aria-label="Return to the main hall">
        <span class="gallery-door-label">main hall</span>
        <span class="gallery-door-depth" aria-hidden="true"><span class="gallery-door-leaf"></span></span>
      </a>
    </div>
    <div class="floor"></div>
  </div>
  <script src="../scripts/gallery.js?v=19"></script>
</body>
</html>
