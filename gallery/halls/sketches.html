<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>sketches · sophie's gallery</title>
  <link rel="icon" type="image/x-icon" href="https://ik.imagekit.io/gale/love-letter.ico?updatedAt=1727232078691">
  <link rel="stylesheet" href="../../global/style.css">
  <script src="../../global/transitions.js"></script>
  <link rel="stylesheet" href="../styles/gallery.css">
  <link rel="stylesheet" href="../styles/main-hall.css">
</head>
<body>
  <div id="gallery" class="gallery-hall hall-page viewport-height" style="--wall-color: #d9d1b8; --floor-tint-base: #625a38; --frame-tint: #594b2855; --wall-text-color: #3f3b2c;">
    <div class="wall">
      <a class="exit-sign" href="../index.html#sketches" aria-label="Exit to the main hall">
        <span class="exit-sign-hanger" aria-hidden="true"></span>
        <span class="exit-sign-back">
          <span class="exit-sign-front">
            <span class="exit-sign-image">
              <img src="../assets/exit-man.svg" alt="">
            </span>
          </span>
        </span>
      </a>
      <div class="wall-text">
        <h1>sketches</h1>
        <p>unfinished thoughts, quick studies, and lines worth keeping.</p>
      </div>

      <button class="museum-label" type="button" aria-label="Enlarge sketches hall card">
        <h2>sketches hall<span class="museum-year">(2025)</span></h2><p class="museum-metadata">graphite on paper, 9 × 12″</p>
        <p>Click any card like this one to bring it closer. Click it again, click outside it, or press escape to return.</p>
      </button>

      <a class="gallery-door gallery-return-door" href="../index.html#sketches" style="--door-wall-color: #edebeb;" aria-label="Return to the main hall">
        <span class="gallery-door-label">main hall</span>
        <span class="gallery-door-depth" aria-hidden="true"><span class="gallery-door-leaf"></span></span>
      </a>
    </div>
    <div class="floor"></div>
  </div>
  <script src="../scripts/gallery.js"></script>
</body>
</html>
