<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>sophie's gallery</title>
  <script>if (!location.hash) location.replace("#lobby");</script>
  <link rel="icon" type="image/x-icon" href="https://ik.imagekit.io/gale/love-letter.ico?updatedAt=1727232078691">
  <link rel="stylesheet" href="../global/style.css">
  <script src="../global/transitions.js"></script>
  <link rel="stylesheet" href="styles/gallery.css">
  <link rel="stylesheet" href="styles/main-hall.css">
</head>
<body>
  <div id="gallery" class="gallery-hall main-hall viewport-height" style="--wall-color: #f2f1f1; --wall-text-color: #473c35;">
    <div class="wall">
      <a class="exit-sign" href="../index.html" aria-label="Exit the gallery and return home">
        <span class="exit-sign-hanger" aria-hidden="true"></span>
        <span class="exit-sign-back">
          <span class="exit-sign-front">
            <span class="exit-sign-image">
              <img src="assets/exit-man.svg" alt="">
            </span>
          </span>
        </span>
      </a>

      <div id="sketches" class="gallery-door is-coming-soon" style="--door-wall-color: #e4e1de;" role="img" aria-label="?, coming soon">
        <span class="gallery-door-label">?</span>
        <span class="gallery-door-depth" aria-hidden="true">
          <span class="gallery-door-leaf"></span>
        </span>
      </div>

      <a id="sunsets" class="gallery-door" href="halls/sunsets.html" style="--door-wall-color: #dfb3b3; --frame-tint: #6b2f2055;">
        <span class="gallery-door-label">sunsets</span>
        <span class="gallery-door-depth" aria-hidden="true">
          <span class="gallery-door-leaf">
            <span class="gallery-door-preview-exhibit">
              <img class="gallery-door-preview framed" src="https://ik.imagekit.io/gale/gallery-sunsets/sunset-9" alt="">
            </span>
          </span>
        </span>
      </a>

      <div id="lobby" class="wall-text main-hall-intro">
        <h1>GALLERIA</h1>
        <blockquote>
          <p>ALL ART IS QUITE USELESS.</p>
          <cite>OSCAR WILDE</cite>
        </blockquote>
        <a class="enter-text" href="#portraits">enter →</a>
      </div>

      <a id="portraits" class="gallery-door" href="halls/portraits.html" style="--door-wall-color: #fbf1e3;">
        <span class="gallery-door-label">portraits</span>
        <span class="gallery-door-depth" aria-hidden="true">
          <span class="gallery-door-leaf">
            <span class="gallery-door-preview-exhibit">
              <img class="gallery-door-preview framed" src="https://ik.imagekit.io/gale/gallery-portraits/angelo-may-12.heic?tr=f-auto" alt="">
            </span>
          </span>
        </span>
      </a>

      <a id="strangers" class="gallery-door" href="halls/strangers.html" style="--door-wall-color: #17253f;">
        <span class="gallery-door-label">strangers</span>
        <span class="gallery-door-depth" aria-hidden="true">
          <span class="gallery-door-leaf">
            <span class="gallery-door-preview-exhibit">
              <img class="gallery-door-preview" src="https://ik.imagekit.io/gale/gallery-strangers/mourning-dove" alt="">
            </span>
          </span>
        </span>
      </a>

      <!--
      <a id="daydream" class="gallery-door" href="halls/daydream.html">
        <span class="gallery-door-label">daydream</span>
        <span class="gallery-door-depth" aria-hidden="true">
          <span class="gallery-door-leaf"></span>
        </span>
      </a>
      -->
    </div>
    <div class="floor"></div>
  </div>
  <script src="scripts/gallery.js"></script>
</body>
</html>
