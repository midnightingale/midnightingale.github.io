<!DOCTYPE html>
<html lang="en" class="page-transition-entering">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <style>html { background: #000; }</style>
  <title>sophie's gallery</title>
  <link rel="stylesheet" href="../global/style.css">
  <link rel="stylesheet" href="styles/gallery.css">
  <link rel="stylesheet" href="styles/main-hall.css">
  <script defer src="../global/transitions.js"></script>
</head>
<body>
  <div class="page-transition-overlay" aria-hidden="true"></div>
  <div id="gallery" class="gallery-hall viewport-height" style="--wall-color: #edebeb; --wall-text-color: #473c35;">
    <div class="wall">
      <a class="exit-sign" href="../index.html" aria-label="Exit the gallery and return home">
        <span class="exit-sign-hanger" aria-hidden="true"></span>
        <span class="exit-sign-back">
          <span class="exit-sign-front">
            <span class="exit-sign-image">
              <img src="assets/exit-man.svg" alt="">
            </span>
          </span>
        </span>
      </a>

      <div class="wall-text main-hall-intro">
        <h1>sophie's gallery</h1>
        <p>choose a hall to enter.</p>
      </div>

      <a id="portraits" class="gallery-door" href="halls/portraits.html">
        <span>portraits</span>
      </a>

      <a id="sunsets" class="gallery-door" href="halls/sunsets.html">
        <span>sunsets</span>
      </a>

      <a id="strangers" class="gallery-door" href="halls/strangers.html">
        <span>strangers</span>
      </a>

      <a id="sketches" class="gallery-door" href="halls/sketches.html">
        <span>sketches</span>
      </a>

      <!--
      <a id="daydream" class="gallery-door" href="halls/daydream.html">
        <span>daydream</span>
      </a>
      -->
    </div>
    <div class="floor"></div>
  </div>
  <script src="scripts/gallery.js"></script>
</body>
</html>
